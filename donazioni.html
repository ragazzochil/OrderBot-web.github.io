<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8"/>
    <title>Supportaci | Galaxy World</title>
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
    
    <!-- Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <style>
        .donation-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .paypal-btn-large {
            background: #0070ba;
            color: white;
            width: 100%;
            padding: 20px;
            border-radius: 100px;
            font-size: 1.25rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            margin-top: 30px;
        }
        .paypal-btn-large:hover {
            background: #005ea6;
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0, 112, 186, 0.4);
        }
    </style>
</head>
<body>

    <!-- Background Mesh -->
    <div class="bg-mesh">
        <div class="bg-circle circle-1"></div>
        <div class="bg-circle circle-2" style="background: radial-gradient(circle, #6133FF 0%, transparent 70%);"></div>
    </div>

    <!-- Navigation -->
    <header class="fade-up" style="animation-delay: 0.1s;">
        <nav class="glass nav-pill">
            <a href="/" style="display: flex; align-items: center; gap: 12px; text-decoration: none; position: relative;">
                <img src="img/logo.png" alt="Logo" style="width: 40px; height: 40px; border-radius: 12px; object-fit: cover;">
                <span style="font-weight: 800; color: white; letter-spacing: -1px; font-size: 1.2rem; user-select: none;">GALAXY WORLD</span>
                <!-- Secret Trigger Overlay -->
                <div id="secret-trigger" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; cursor: default;"></div>
            </a>
            <div class="nav-links">
                <a href="https://discord.gg/KxhZWFJvDE"><i class="fa-brands fa-discord"></i> Discord</a>
                <a href="donazioni.html"><i class="fa-solid fa-heart"></i> Supporto</a>
            </div>
            <a href="https://discord.gg/KxhZWFJvDE" class="btn-primary" style="padding: 10px 24px; font-size: 14px;">Entra</a>
        </nav>
    </header>

    <div class="donation-container">
        <div class="glass-premium fade-up" style="max-width: 500px; width: 100%; padding: 60px; text-align: center;">
            <a href="/" style="color: var(--apple-purple); text-decoration: none; font-weight: 700; display: inline-block; margin-bottom: 30px;">
                <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Torna alla Home
            </a>
            <h1 style="font-size: 3rem; margin-bottom: 20px;">Supportaci</h1>
            <p style="color: var(--apple-text-muted); line-height: 1.6; margin-bottom: 20px;">
                Il tuo contributo ci aiuta a mantenere il server attivo e a sviluppare nuove funzionalità per la community di Galaxy World.
            </p>

            <a href="https://paypal.me/giovannipasulo" class="paypal-btn-large">
                <i class="fa-brands fa-paypal" style="margin-right: 12px;"></i> Dona con PayPal
            </a>

            <div style="margin-top: 40px; display: flex; justify-content: center; gap: 20px; opacity: 0.3;">
                <i class="fa-brands fa-cc-visa text-2xl"></i>
                <i class="fa-brands fa-cc-mastercard text-2xl"></i>
                <i class="fa-brands fa-cc-amex text-2xl"></i>
            </div>

            <p style="margin-top: 30px; font-size: 0.8rem; color: var(--apple-text-muted);">
                Ogni donazione è apprezzata. Grazie!
            </p>
        </div>
    </div>

    <!-- GAME -->
<div id="game-container" class="game-overlay">
    <canvas id="game-canvas"></canvas>
</div>

<script src="js/game.js?v=9"></script>
